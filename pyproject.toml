[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# Ruff's historical defaults (E4, E7, E9, F) plus flake8-blind-except, listed
# explicitly rather than via extend-select: ruff's *default* select has widened
# between versions, so an implicit baseline means the pinned pre-commit hook
# (v0.9.10) and a developer's newer local ruff disagree about what "clean" is.
#
# BLE001 flags `except Exception`. Eight sites already carried a `# noqa: BLE001`
# with a reason before the rule was ever enabled, so the intent predates the
# enforcement; turning it on makes those annotations real.
#
# A blind except is sometimes right -- re-raising as a domain error, or guarding
# a UI handler so one bad input cannot take the page down. Those keep the noqa
# and say why. What it must not do is swallow an already-classified error.
select = ["E4", "E7", "E9", "F", "BLE001"]
