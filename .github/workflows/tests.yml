name: tests

# The only workflow that gates a change. Everything else in this repo runs on a
# monthly cron to stay inside the free-plan Actions minutes for a private repo
# (see 2ed7eb5). This one is deliberately exempt: the suite is network-free and
# finishes in well under a second, so gating every push and PR costs ~1 minute
# of the monthly budget per run while catching the regressions that matter.
#
# It runs on EVERY pull request, with no paths filter. `pytest` is a required
# status check on main, and a required check that is skipped is never reported
# -- so a docs-only PR sat permanently BLOCKED, waiting for a run that by
# construction could never happen. Skipping doc changes saved about a minute a
# PR and cost the ability to merge them at all.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes an in-flight run redundant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Added as a step on this job rather than a workflow of its own: Actions
      # bills per job-minute, and checkout + setup-python already dominate this
      # one, so linting here costs seconds instead of a whole extra minute
      # against the budget described above. org-precommit still runs the full
      # hook set monthly.
      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest
