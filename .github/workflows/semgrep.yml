name: semgrep

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 11 * *"  # monthly (minute-safe policy)

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Semgrep
        run: semgrep scan --config auto --error
