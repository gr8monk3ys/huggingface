version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before adopting a brand-new release, so a compromised or yanked
    # version has time to be caught upstream rather than auto-proposed here.
    cooldown:
      default-days: 7
    ignore:
      # Same-owner reusable workflows live in the PRIVATE gr8monk3ys/github
      # repo; Dependabot cannot reach it (git_dependencies_not_reachable)
      # and fails every weekly run. They are pinned manually, not versioned.
      - dependency-name: "gr8monk3ys/*"
