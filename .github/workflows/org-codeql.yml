name: org-codeql

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 11 * *"  # monthly (minute-safe policy)

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: org-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: gr8monk3ys/org-workflows/.github/workflows/reusable-codeql.yml@2659a9a32c4e6e3858f69a2f502210941a886d5a
